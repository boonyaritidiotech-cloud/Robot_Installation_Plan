<div class="row g-3">

  <!-- ส่วนส่งคำขอ -->
  <div class="col-lg-5">
    <div class="card p-4 shadow-sm border-0 mb-3" style="border-radius: 15px;">
      <h6 class="fw-bold text-info mb-3"><i class="bi bi-send-plus-fill"></i> ส่งคำขอลงแผนงาน</h6>

      <div class="row g-2 mb-2">
        <div class="col-6">
          <label class="small fw-bold text-secondary">วันที่เริ่ม</label>
          <input type="date" id="req_start" class="form-control form-control-sm" onchange="triggerReqStaff()">
        </div>
        <div class="col-6">
          <label class="small fw-bold text-secondary">วันที่สิ้นสุด</label>
          <input type="date" id="req_end" class="form-control form-control-sm" onchange="triggerReqStaff()">
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="small fw-bold text-secondary">เวลาเริ่ม</label>
          <input type="time" id="req_sTime" class="form-control form-control-sm" value="09:00" onchange="triggerReqStaff()">
        </div>
        <div class="col-6">
          <label class="small fw-bold text-secondary">เวลาเสร็จ</label>
          <input type="time" id="req_eTime" class="form-control form-control-sm" value="17:00" onchange="triggerReqStaff()">
        </div>
      </div>

      <div class="mb-3">
        <label class="small fw-bold text-secondary">สถานที่ (Location)</label>
        <input type="text" id="req_location" class="form-control form-control-sm" placeholder="ระบุพิกัดหรือที่อยู่ลูกค้า">
      </div>

      <div class="mb-2">
        <label class="small fw-bold text-secondary">ลูกค้า (Customer)</label>
        <select id="req_cust" class="form-select form-select-sm shadow-none" onchange="fillReqBranch()">
          <option value="">-- เลือกบริษัทลูกค้า --</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="small fw-bold text-secondary">สาขา (Branch)</label>
        <select id="req_branch" class="form-select form-select-sm">
          <option value="">-- เลือกสาขา --</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="small fw-bold text-secondary">ประเภทงาน <span class="text-danger">*</span></label>
        <select id="req_jobType" class="form-select form-select-sm">
          <option value="">-- เลือกประเภทงาน --</option>
          <option value="ประชุม">📋 ประชุม</option>
          <option value="MA / ซ่อมเคส">🔧 MA / ซ่อมเคส</option>
          <option value="Install">🤖 Install</option>
          <option value="PM">⚙️ PM</option>
          <option value="Demo">🎯 Demo</option>
          <option value="Service">🛠️ Service</option>
        </select>
      </div>

      <!-- รายการหุ่นยนต์ -->
      <div class="p-2 border rounded bg-light mb-3">
        <label class="small fw-bold text-primary mb-2 d-block">รายการหุ่นยนต์</label>
        <div class="row g-1 mb-2">
          <div class="col-4">
            <select id="req_brand" class="form-select form-select-sm" onchange="filterReqRobots()">
              <option value="">-- ยี่ห้อ --</option>
            </select>
          </div>
          <div class="col-4">
            <select id="req_model" class="form-select form-select-sm">
              <option value="">-- รุ่น --</option>
            </select>
          </div>
          <div class="col-2">
            <input type="number" id="req_robotQty" class="form-control form-control-sm" value="1" min="1">
          </div>
          <div class="col-2">
            <button class="btn btn-success btn-sm w-100" onclick="addReqRobotToList()">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
        </div>
        <div id="reqRobotList" class="small text-muted border-top pt-1 mt-1">ยังไม่มีรายการ</div>
      </div>

      <div class="mb-3">
        <label class="small fw-bold text-secondary">หมายเหตุ (Remark)</label>
        <textarea id="req_remark" class="form-control form-control-sm" rows="2"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">
          <i class="bi bi-people-fill text-primary"></i> สถานะ Staff
          <span class="text-muted fw-normal">(ข้อมูลอ้างอิง)</span>
        </label>
        <div id="reqStaffPanel" class="border rounded p-2 bg-light" style="max-height:200px;overflow-y:auto;">
          <span class="text-muted small">กรอกวันที่ก่อน</span>
        </div>
      </div>

      <button class="btn btn-info w-100 fw-bold text-white" id="reqSubmitBtn" onclick="submitRequest()">
        <i class="bi bi-send-fill"></i> ส่งคำขอ
      </button>
      <div id="reqMsg" class="mt-2 small text-center"></div>
    </div>
  </div>

  <!-- Calendar + สถานะคำขอ -->
  <div class="col-lg-7">
    <!-- Calendar -->
    <div class="card p-2 shadow-sm mb-3" style="border-radius: 15px;">
      <iframe id="reqCalendarIframe"
        src="https://calendar.google.com/calendar/embed?src=3vsvb0a1nblh7odvi0qecsb0a0%40group.calendar.google.com&ctz=Asia%2FBangkok"
        style="border:0" width="100%" height="350" frameborder="0" scrolling="no"></iframe>
    </div>

    <!-- สถานะคำขอของฉัน -->
    <div class="card p-3 shadow-sm border-0" style="border-radius: 15px;">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold text-primary mb-0"><i class="bi bi-clock-history"></i> สถานะคำขอของฉัน</h6>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadMyRequests()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
      <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
        <table class="table table-sm table-hover small align-middle">
          <thead class="table-light sticky-top">
            <tr>
              <th>Req ID</th>
              <th>ลูกค้า</th>
              <th>วันที่</th>
              <th>สถานะ</th>
              <th>เหตุผล</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="myRequestBody">
            <tr><td colspan="6" class="text-center text-muted">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal แก้ไขและส่งใหม่ -->
<div class="modal fade" id="resubmitModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h6 class="modal-title fw-bold"><i class="bi bi-pencil-square"></i> แก้ไขและส่งคำขอใหม่</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="resubmit_reqId">
        <div class="row g-2">
          <div class="col-6">
            <label class="small fw-bold text-secondary">วันที่เริ่ม</label>
            <input type="date" id="resub_start" class="form-control form-control-sm">
          </div>
          <div class="col-6">
            <label class="small fw-bold text-secondary">วันที่สิ้นสุด</label>
            <input type="date" id="resub_end" class="form-control form-control-sm">
          </div>
          <div class="col-6">
            <label class="small fw-bold text-secondary">เวลาเริ่ม</label>
            <input type="time" id="resub_sTime" class="form-control form-control-sm">
          </div>
          <div class="col-6">
            <label class="small fw-bold text-secondary">เวลาเสร็จ</label>
            <input type="time" id="resub_eTime" class="form-control form-control-sm">
          </div>
          <div class="col-12">
            <label class="small fw-bold text-secondary">ลูกค้า</label>
            <select id="resub_cust" class="form-select form-select-sm" onchange="fillResubBranch()">
              <option value="">-- เลือกลูกค้า --</option>
            </select>
          </div>
          <div class="col-12">
            <label class="small fw-bold text-secondary">สาขา</label>
            <select id="resub_branch" class="form-select form-select-sm">
              <option value="">-- เลือกสาขา --</option>
            </select>
          </div>
          <div class="col-12">
            <label class="small fw-bold text-secondary">สถานที่</label>
            <input type="text" id="resub_location" class="form-control form-control-sm">
          </div>

          <!-- รายการหุ่นยนต์ resub -->
          <div class="col-12">
            <div class="p-2 border rounded bg-light">
              <label class="small fw-bold text-primary mb-2 d-block">รายการหุ่นยนต์</label>
              <div class="row g-1 mb-2">
                <div class="col-4">
                  <select id="resub_brand" class="form-select form-select-sm" onchange="filterResubRobots()">
                    <option value="">-- ยี่ห้อ --</option>
                  </select>
                </div>
                <div class="col-4">
                  <select id="resub_model" class="form-select form-select-sm">
                    <option value="">-- รุ่น --</option>
                  </select>
                </div>
                <div class="col-2">
                  <input type="number" id="resub_robotQty" class="form-control form-control-sm" value="1" min="1">
                </div>
                <div class="col-2">
                  <button class="btn btn-success btn-sm w-100" onclick="addResubRobotToList()">
                    <i class="bi bi-plus-lg"></i>
                  </button>
                </div>
              </div>
              <div id="resubRobotList" class="small text-muted border-top pt-1 mt-1">ยังไม่มีรายการ</div>
            </div>
          </div>

          <div class="col-12">
            <label class="small fw-bold text-secondary">หมายเหตุ</label>
            <textarea id="resub_remark" class="form-control form-control-sm" rows="2"></textarea>
          </div>
        </div>
        <div id="resubMsg" class="mt-2 small"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">ยกเลิก</button>
        <button class="btn btn-warning btn-sm fw-bold" onclick="confirmResubmit()">
          <i class="bi bi-send-fill"></i> ส่งคำขอใหม่
        </button>
      </div>
    </div>
  </div>
</div>
