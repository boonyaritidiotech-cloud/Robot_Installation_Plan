<div class="card p-4 shadow-sm border-0" style="background: #ffffff; border-radius: 15px;">
  <h6 class="fw-bold text-primary mb-3"><i class="bi bi-plus-circle-fill"></i> ADD SERVICE PLAN</h6>
  
  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="small fw-bold text-secondary">วันที่เริ่ม</label>
      <input type="date" id="start" class="form-control form-control-sm">
    </div>
    <div class="col-6">
      <label class="small fw-bold text-secondary">วันที่สิ้นสุด</label>
      <input type="date" id="end" class="form-control form-control-sm">
    </div>
  </div>

  <div class="mb-3">
    <label class="small fw-bold text-secondary">ลูกค้า (Customer)</label>
    <select id="custSelect" class="form-select form-select-sm shadow-none">
      <option value="">-- เลือกบริษัทลูกค้า --</option>
    </select>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="small fw-bold text-secondary">ยี่ห้อ (Brand)</label>
      <select id="brand" class="form-select form-select-sm" onchange="filterRobots()">
        <option value="">-- ยี่ห้อ --</option>
      </select>
    </div>
    <div class="col-6">
      <label class="small fw-bold text-secondary">รุ่น (Model)</label>
      <select id="model" class="form-select form-select-sm">
        <option value="">-- รุ่น --</option>
      </select>
    </div>
  </div>

  <div class="mb-3">
    <label class="small fw-bold text-secondary">มอบหมายแผนก (Dept)</label>
    <select id="deptSelect" class="form-select form-select-sm mb-2" onchange="showStaffByDept()">
      <option value="">-- เลือกแผนก --</option>
    </select>
    <div id="staffList" class="staff-box border p-2 bg-light" style="max-height: 120px; overflow-y: auto; border-radius: 8px;">
      </div>
  </div>

  <button class="btn btn-primary w-100 fw-bold shadow-sm" id="saveBtn" onclick="save()">
    <i class="bi bi-save-fill"></i> บันทึกแผนงาน
  </button>
</div>
